services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: cotolk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: cotolk
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "cotolk", "-d", "cotolk"]
      interval: 2s
      retries: 30

  web:
    build: .
    image: cotolk
    command: ["web"]
    environment:
      DATABASE_URL: postgres://cotolk:${POSTGRES_PASSWORD}@postgres:5432/cotolk
      COTOLK_PUBLIC_URL: ${COTOLK_PUBLIC_URL:-http://localhost:3000}
    ports:
      - "${COTOLK_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres:
